[project]
name = "cam"
version = "0.2.0"
description = "Database-free tracker of US state WARN layoff notices"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "tenacity>=9.0,<10.0",
    "beautifulsoup4>=4.12,<5.0",
    "openpyxl>=3.1,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.1,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.4,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=cam --cov-report=term-missing --cov-report=html --cov-report=xml -v -m 'not live'"
markers = [
    "live: test hits a real external endpoint (network required). Excluded from the default run; select explicitly with -m live (see tests/smoke/).",
]

[tool.coverage.run]
source = ["cam"]

[tool.coverage.report]
# Raised to 80 once all modules ship; kept at 0 during bootstrap phase
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cam", "tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
