# Weekly live check: fetch and parse every configured WARN state source.
# A failure here means a state changed its page and the parser needs updating.
name: Weekly Smoke Test

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: Run live smoke tests
        run: uv run pytest tests/smoke -m live -v --no-cov
