# Frontend Build Validation
#
# Runs on PRs that touch frontend/: logic tests, type-check + build, lint.
# Deployment happens in publish.yml.

name: Frontend Build

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Logic tests
        run: node --test "tests/*.test.ts"

      - name: Type-check
        run: npm run build

      - name: Lint
        run: npx eslint src --max-warnings 0
